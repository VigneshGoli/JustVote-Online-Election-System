<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JustVote | Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css">
    <link rel="icon" href="images/logos.png" type="image/x-icon">
</head>
<body>
    <div class="container">
        <form id="login-form">
            <h2>Login</h2>
            <div class="input-field">
                <input type="text" id="login-voter-id" required>
                <label for="login-voter-id">Enter Voter ID</label>
            </div>
            <div class="input-field">
                <input type="password" id="login-password" required>
                <label for="login-password">Enter Password</label>
            </div>
            <button type="submit">Log in</button>
            <div class="Create-account">
                <p>Don't have an account? <a href="registration.html">Create account</a></p>
            </div>
        </form>
    </div>

    <script src="login.js"></script>
</body>
</html>

<script>
document.addEventListener('DOMContentLoaded', function () {
    var loginForm = document.getElementById('login-form');

    loginForm.addEventListener('submit', function (event) {
        event.preventDefault();

        // Retrieve login values
        var loginVoterId = document.getElementById('login-voter-id').value;
        var loginPassword = document.getElementById('login-password').value;

        // Retrieve user details from localStorage
        var storedUser = localStorage.getItem('user_' + loginVoterId);

        if (storedUser) {
            var userDetails = JSON.parse(storedUser);

            // Verify login details
            if (loginPassword === userDetails.password) {
                alert("Login successful!");
                sessionStorage.setItem('loggedInUser', userDetails.voterId);
                // Redirect to vote page after successful login
                window.location.href = 'Vote-Now.html';
            } else {
                alert("Invalid Voter ID or password.");
            }
        } else {
            alert("User not found. Please register first.");
        }
    });
});
</script>
